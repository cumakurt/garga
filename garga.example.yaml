# garga configuration example. Omitted values use built-in defaults.
scanner:
  concurrency: 20
  requests_per_second: 50
  per_host_requests_per_second: 5
  connect_timeout: 2s
  request_timeout: 5s
  retries: 1
  max_response_bytes: 524288

fingerprint:
  threshold: 80

output:
  format: console

logging:
  level: warn
